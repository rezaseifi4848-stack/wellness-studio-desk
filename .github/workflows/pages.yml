name: Deploy Esmiyar to GitHub Pages
on:
  push:
    branches: [master]
    paths:
      - "esmiyar/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Typecheck JavaScript
        run: node --check esmiyar/app.js && node --check esmiyar/engine.js
      - name: Test Abjad engine
        run: node --test esmiyar/engine.test.mjs
      - name: Build static artifact
        run: mkdir -p dist/esmiyar && cp esmiyar/index.html esmiyar/app.js esmiyar/engine.js esmiyar/names.js esmiyar/styles.css dist/esmiyar/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
